<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Nur Muhammad Wafa</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
            color: #111827; /* Tailwind gray-900 */
        }
        
        /* Layout untuk mensimulasikan kertas A4 di layar komputer */
        .a4-container {
            max-width: 210mm; /* A4 width */
            margin: 0 auto;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Styling khusus agar link tetap terlihat bagus saat dicetak */
        a {
            color: #000;
            text-decoration: none;
        }

        /* Saat menggenerate PDF atau di-print, hilangkan shadow dan margin luar */
        @media print {
            body {
                background-color: white;
            }
            .a4-container {
                box-shadow: none;
                margin: 0;
                max-width: 100%;
            }
            #download-btn-container {
                display: none !important;
            }
        }
    </style>
</head>
<body class="py-10 px-4 sm:px-8">

    <div id="cv-wrapper" class="a4-container p-8 sm:p-12 mb-8">
        <!-- Konten CV akan dirender oleh JavaScript di sini -->
        <div id="cv-content"></div>
